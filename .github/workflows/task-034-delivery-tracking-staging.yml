name: TASK-034 Delivery Tracking Staging Smoke

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Exact main commit containing the validated tracking migration"
        required: true
        type: string
      confirmation:
        description: "Enter RUN_TASK034_DELIVERY_TRACKING_STAGING"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: task-034-delivery-tracking-staging
  cancel-in-progress: false

env:
  SOURCE_POOLER_HOST: aws-1-sa-east-1.pooler.supabase.com

jobs:
  smoke:
    name: Remote pgTAP, RLS and synthetic lifecycle smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-staging

    env:
      ALLOWED_STAGING_SUPABASE_PROJECT_REFS: ${{ vars.ALLOWED_STAGING_SUPABASE_PROJECT_REFS }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4

      - name: Verify immutable staging inputs
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const ref = process.env.STAGING_SUPABASE_PROJECT_REF || "";
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL || "";
          const allowed = (process.env.ALLOWED_STAGING_SUPABASE_PROJECT_REFS || "")
            .split(",")
            .map((value) => value.trim())
            .filter(Boolean);
          let urlMatchesProject = false;
          try {
            urlMatchesProject = new URL(url).hostname === `${ref}.supabase.co`;
          } catch {}
          const status = {
            mainBranch: process.env.GITHUB_REF === "refs/heads/main",
            exactHead:
              /^[0-9a-f]{40}$/.test(process.env.EXPECTED_HEAD_SHA || "") &&
              process.env.GITHUB_SHA === process.env.EXPECTED_HEAD_SHA,
            projectRefShapeOk: /^[a-z0-9]{20}$/.test(ref),
            allowedProject: allowed.includes(ref),
            urlMatchesProject,
            databasePasswordPresent: Boolean(process.env.SUPABASE_DB_PASSWORD),
            confirmationOk:
              process.env.CONFIRMATION ===
              "RUN_TASK034_DELIVERY_TRACKING_STAGING",
          };
          console.log(JSON.stringify(status));
          if (Object.values(status).some((value) => !value)) process.exit(1);
          NODE

      - name: Build protected database URL
        id: connection
        run: |
          set -euo pipefail
          mkdir -p _task034-staging/evidence
          SOURCE_DB_URL="$(node <<'NODE'
          const ref = process.env.STAGING_SUPABASE_PROJECT_REF;
          const password = process.env.SUPABASE_DB_PASSWORD;
          const host = process.env.SOURCE_POOLER_HOST;
          if (!ref || !password || !host) process.exit(1);
          process.stdout.write(
            `postgresql://postgres.${ref}:${encodeURIComponent(password)}@${host}:5432/postgres?sslmode=require`,
          );
          NODE
          )"
          echo "::add-mask::$SOURCE_DB_URL"
          printf '%s' "$SOURCE_DB_URL" > _task034-staging/source-db-url
          chmod 600 _task034-staging/source-db-url

      - name: Run remote synthetic tracking smoke with rollback
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _task034-staging/source-db-url)"
          npx --yes supabase@2.111.0 \
            --workdir "$PWD" \
            test db \
            --db-url "$SOURCE_DB_URL" \
            supabase/tests/storefront_delivery_tracking_v1.sql \
            2>&1 | tee _task034-staging/evidence/remote-pgtap.txt
          sed -i \
            -e "s/$STAGING_SUPABASE_PROJECT_REF/[STAGING_REF]/g" \
            -e "s/$SOURCE_POOLER_HOST/[POOLER_HOST]/g" \
            _task034-staging/evidence/remote-pgtap.txt

      - name: Verify migration ledger and synthetic cleanup
        if: always() && steps.connection.outcome == 'success'
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _task034-staging/source-db-url)"
          docker run --rm --network host \
            -e SOURCE_DB_URL="$SOURCE_DB_URL" \
            postgres:17 \
            psql -X -qAt -v ON_ERROR_STOP=1 "$SOURCE_DB_URL" <<'SQL' \
            > _task034-staging/evidence/cleanup.json
          select jsonb_build_object(
            'migrationApplied', exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '20260816072836'
                and name = 'storefront_delivery_tracking_v1'
            ),
            'fixtureRowsClean', (
              (select count(*) from auth.users
               where id::text like '00000000-0000-4000-8000-000000044%') +
              (select count(*) from public.shops
               where shop_id::text like '14000000-0000-4000-8000-000000044%') +
              (select count(*) from public.customer_orders
               where id::text like '44000000-0000-4000-8000-000000044%') +
              (select count(*) from public.staff_accounts
               where staff_id::text like '54000000-0000-4000-8000-000000044%') +
              (select count(*) from public.delivery_tracking_sessions
               where order_id::text like '44000000-0000-4000-8000-000000044%')
            ) = 0
          );
          SQL
          node <<'NODE'
          const report = JSON.parse(
            require("node:fs").readFileSync(
              "_task034-staging/evidence/cleanup.json",
              "utf8",
            ),
          );
          console.log(JSON.stringify(report));
          if (!report.migrationApplied || !report.fixtureRowsClean) process.exit(1);
          NODE

      - name: Remove protected connection material
        if: always()
        run: rm -f _task034-staging/source-db-url

      - name: Upload sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-034-delivery-tracking-staging-${{ github.run_id }}
          path: _task034-staging/evidence
          if-no-files-found: error
          retention-days: 14
