name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      database_replay_only:
        description: Isolated local database replay only; no staging environment or live E2E
        type: boolean
        default: false
        required: false
      authenticated_history_only:
        description: Owned disposable replay plus real Core/Data and Admin history roundtrip; no staging
        type: boolean
        default: false
        required: false
      history_client_sha:
        description: Immutable public Win7POS commit for the owned authenticated history harness
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  database:
    name: Database migrations and pgTAP
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.authenticated_history_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      OPENAI_API_KEY: ci-local-placeholder
      S3_ACCESS_KEY: ci-local-placeholder
      S3_HOST: ci-local-placeholder.invalid
      S3_REGION: local
      S3_SECRET_KEY: ci-local-placeholder
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-local-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-local-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ci-local-placeholder
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-local-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Replay local migrations and run database pgTAP
        run: >-
          python3 scripts/ci/mobile-recovery-local-replay.py run
          --repo "$GITHUB_WORKSPACE"
          --workdir "$RUNNER_TEMP/mobile-recovery-local"
          --evidence-dir "$RUNNER_TEMP/database-replay-evidence"

      - name: Preserve closed database replay evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: database-replay-evidence
          path: |
            ${{ runner.temp }}/database-replay-evidence/error.json
            ${{ runner.temp }}/database-replay-evidence/pgtap-diagnostics.json
            ${{ runner.temp }}/database-replay-evidence/extension-diagnostics.json
            ${{ runner.temp }}/database-replay-evidence/complete.json
            ${{ runner.temp }}/database-replay-evidence/history-concurrency.json
          if-no-files-found: warn

  verify:
    name: Verify
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.database_replay_only != true && inputs.authenticated_history_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx', 'src/**/*.css', 'app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Security scan
        run: npm run security:scan

      - name: Foundation tests
        run: npm run test:foundation

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: UI smoke
        run: npm run test:ui-smoke:ci

      - name: Mini pairing component regressions
        env:
          PLAYWRIGHT_DISABLE_WEB_SERVER: "1"
        run: npx playwright test tests/e2e/wechat-010-pairing-component.spec.ts --project=chromium-desktop

      - name: Historical card import component regressions
        env:
          PLAYWRIGHT_DISABLE_WEB_SERVER: "1"
        run: npx playwright test tests/e2e/asus019-payment-history-component.spec.ts tests/e2e/asus019-history-transfer-component.spec.ts --project=chromium-desktop --workers=1

      - name: Mini Worker HTTPS transport with intercepted upstream
        run: node scripts/testing/wechat-010-worker-transport.mjs

      - name: Diff whitespace check
        run: git diff --check

  task-094-staging-e2e:
    name: TASK-094 staging E2E
    needs: [verify, database]
    if: github.event_name == 'workflow_dispatch' && inputs.database_replay_only != true && inputs.authenticated_history_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TASK094_POS_E2E_ALLOW_STAGING: "yes"
      TASK094_POS_E2E_BASE_URL: ${{ vars.CLOUDFLARE_STAGING_URL }}
      TASK094_POS_E2E_STAGING_HOST_ALLOWLIST: merchandise-control-admin-web-staging.merchandise-control-admin-web.workers.dev
      TASK094_POS_E2E_STAGING_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      TASK094_POS_E2E_TEST_RUN_ID: STG${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify staging E2E inputs
        run: |
          set -euo pipefail
          node <<'NODE'
          const required = [
            "NEXT_PUBLIC_SUPABASE_URL",
            "SUPABASE_SERVICE_ROLE_KEY",
            "TASK094_POS_E2E_BASE_URL",
            "TASK094_POS_E2E_STAGING_PROJECT_REF",
          ];
          const status = Object.fromEntries(
            required.map((key) => [key, Boolean(process.env[key])]),
          );
          console.log(JSON.stringify(status));
          if (Object.values(status).some((present) => !present)) {
            process.exit(1);
          }
          NODE

      - name: Verify TASK-094 migration files before live E2E
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260705120000_task_094_pos_catalog_import_sync.sql
          test -f supabase/migrations/20260706120000_task_094_pos_catalog_import_apply_rpc.sql
          test -f supabase/migrations/20260706143000_task_094_pos_catalog_import_ack_replay.sql

      - name: Run TASK-094 catalog import staging E2E
        run: npm run test:pos-catalog-import-staging-e2e

  authenticated-history:
    name: ASUS019 owned authenticated history services
    if: github.event_name == 'workflow_dispatch' && inputs.authenticated_history_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASUS019_CLIENT_SHA: ${{ inputs.history_client_sha }}
      OPENAI_API_KEY: ci-local-placeholder
      S3_ACCESS_KEY: ci-local-placeholder
      S3_HOST: ci-local-placeholder.invalid
      S3_REGION: local
      S3_SECRET_KEY: ci-local-placeholder
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-local-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-local-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: ci-local-placeholder
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-local-placeholder
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout Admin
        uses: actions/checkout@v4
        with:
          path: admin
      - name: Validate immutable client input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ASUS019_CLIENT_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout exact public client
        uses: actions/checkout@v4
        with:
          repository: XNIW/Win7POS
          ref: ${{ inputs.history_client_sha }}
          path: client
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Setup CLR
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Canonical owned replay without changed SQL budgets
        timeout-minutes: 25
        run: >-
          python3 scripts/ci/mobile-recovery-local-replay.py run
          --repo "$GITHUB_WORKSPACE/admin"
          --workdir "$RUNNER_TEMP/asus019-history-local"
          --evidence-dir "$RUNNER_TEMP/asus019-history-database"
      - name: Authenticated service and browser roundtrip
        timeout-minutes: 12
        run: >-
          node scripts/testing/asus019-authenticated-history.mjs
          --owned-workdir "$RUNNER_TEMP/asus019-history-local"
          --client-repo "$GITHUB_WORKSPACE/client"
          --evidence-dir "$RUNNER_TEMP/asus019-authenticated-history"
      - name: Preserve only closed qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asus019-authenticated-history-evidence
          path: |
            ${{ runner.temp }}/asus019-history-database/complete.json
            ${{ runner.temp }}/asus019-history-database/error.json
            ${{ runner.temp }}/asus019-history-database/pgtap-diagnostics.json
            ${{ runner.temp }}/asus019-history-database/extension-diagnostics.json
            ${{ runner.temp }}/asus019-history-database/history-concurrency.json
            ${{ runner.temp }}/asus019-authenticated-history/authenticated-history.json
          if-no-files-found: error
