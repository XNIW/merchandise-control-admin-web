name: TASK-023 Customer Cart Staging

on:
  push:
    branches:
      - integration/storefront-v1
    paths:
      - .github/workflows/storefront-v1-staging-migrations.yml
      - .github/workflows/task-023-customer-cart-staging.yml
      - supabase/migrations/20260802210000_storefront_v1_customer_cart.sql
      - supabase/tests/storefront_v1_customer_cart.sql
      - scripts/testing/storefront-v1-customer-cart-concurrency.sh
      - tests/foundation/storefront-v1-customer-cart.test.mjs

permissions:
  contents: read

concurrency:
  group: task-023-customer-cart-staging
  cancel-in-progress: false

jobs:
  staging-customer-cart-contract:
    uses: ./.github/workflows/storefront-v1-staging-migrations.yml
    with:
      mode: apply
      expected_head_sha: ${{ github.sha }}
      expected_migration_version: "20260802210000"
      expected_migration_name: storefront_v1_customer_cart
      expected_migration_file: 20260802210000_storefront_v1_customer_cart.sql
      apply_confirmation: APPLY_STOREFRONT_V1_STAGING
      load_hold_seconds: "0"
      run_performance_load: false
    secrets: inherit
