name: TASK-032 Customer Payments Staging

on:
  workflow_dispatch:
  push:
    branches:
      - integration/storefront-v1
    paths:
      - .github/workflows/task-032-customer-payments-staging.yml
      - package.json
      - scripts/testing/storefront-v1-customer-payment-concurrency.sh
      - src/app/shop/storefront/actions.ts
      - src/app/shop/storefront/page.tsx
      - src/lib/supabase/database.types.ts
      - src/server/payments/storefront-payment-provider.mjs
      - src/server/shop-admin/staff-web-lease-bound-rpc.ts
      - src/server/shop-admin/storefront-mutations.ts
      - src/server/shop-admin/storefront-read-model.ts
      - supabase/migrations/20260803122644_storefront_v1_customer_payments.sql
      - supabase/tests/storefront_v1_customer_payments.sql
      - tests/foundation/storefront-v1-customer-payments.test.mjs

permissions:
  contents: read

concurrency:
  group: storefront-v1-staging-order-payment
  cancel-in-progress: false

jobs:
  apply-customer-payments:
    uses: ./.github/workflows/storefront-v1-staging-migrations.yml
    with:
      mode: apply
      expected_head_sha: ${{ github.sha }}
      expected_migration_version: "20260803122644"
      expected_migration_name: storefront_v1_customer_payments
      expected_migration_file: 20260803122644_storefront_v1_customer_payments.sql
      apply_confirmation: APPLY_STOREFRONT_V1_STAGING
      load_hold_seconds: "0"
      run_performance_load: false
    secrets: inherit

  verify-customer-payments:
    needs: apply-customer-payments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-staging
    env:
      ALLOWED_STAGING_SUPABASE_PROJECT_REFS: ${{ vars.ALLOWED_STAGING_SUPABASE_PROJECT_REFS }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SOURCE_POOLER_HOST: aws-1-sa-east-1.pooler.supabase.com
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verify immutable staging target
        run: |
          set -euo pipefail
          node <<'NODE'
          const ref = process.env.STAGING_SUPABASE_PROJECT_REF || "";
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL || "";
          const allowed = (process.env.ALLOWED_STAGING_SUPABASE_PROJECT_REFS || "")
            .split(",")
            .map((value) => value.trim())
            .filter(Boolean);
          let urlMatchesProject = false;
          try {
            urlMatchesProject = new URL(url).hostname === `${ref}.supabase.co`;
          } catch {}
          const status = {
            databasePasswordPresent: Boolean(process.env.SUPABASE_DB_PASSWORD),
            exactHead: /^[0-9a-f]{40}$/.test(process.env.GITHUB_SHA || ""),
            integrationBranch:
              process.env.GITHUB_REF === "refs/heads/integration/storefront-v1",
            projectRefShapeOk: /^[a-z0-9]{20}$/.test(ref),
            allowedProject: allowed.includes(ref),
            urlMatchesProject,
          };
          console.log(JSON.stringify(status));
          if (Object.values(status).some((value) => !value)) process.exit(1);
          NODE

      - name: Build protected database URL
        run: |
          set -euo pipefail
          mkdir -p _task032-evidence
          SOURCE_DB_URL="$(node <<'NODE'
          const ref = process.env.STAGING_SUPABASE_PROJECT_REF;
          const password = process.env.SUPABASE_DB_PASSWORD;
          const host = process.env.SOURCE_POOLER_HOST;
          if (!ref || !password || !host) process.exit(1);
          process.stdout.write(
            `postgresql://postgres.${ref}:${encodeURIComponent(password)}`
              + `@${host}:5432/postgres?sslmode=require`,
          );
          NODE
          )"
          echo "::add-mask::$SOURCE_DB_URL"
          printf '%s' "$SOURCE_DB_URL" > _task032-db-url
          chmod 600 _task032-db-url

      - name: Verify payment contract and pickup/COD E2E
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _task032-db-url)"
          docker run --rm --network host \
            -v "$PWD:/workspace:ro" \
            postgres:17 \
            psql -X -qAt -v ON_ERROR_STOP=1 \
              "$SOURCE_DB_URL" \
              -f /workspace/supabase/tests/storefront_v1_customer_payments.sql \
              > _task032-evidence/pgtap.txt

      - name: Verify payment create concurrency and cleanup
        env:
          STOREFRONT_PAYMENT_ALLOW_REMOTE: APPLY_STOREFRONT_V1_STAGING_PAYMENT
        run: |
          set -euo pipefail
          export STOREFRONT_PAYMENT_DB_URL="$(cat _task032-db-url)"
          npm run test:storefront:customer-payment-concurrency |
            tee _task032-evidence/concurrency.txt

      - name: Verify deployed security and production-off posture
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _task032-db-url)"
          docker run --rm --network host \
            postgres:17 \
            psql -X -qAt -v ON_ERROR_STOP=1 \
              "$SOURCE_DB_URL" \
              -c "select jsonb_build_object(
                'migrationLedgerExact', (
                  select count(*) = 1
                  from supabase_migrations.schema_migrations
                  where version = '20260803122644'
                    and name = 'storefront_v1_customer_payments'
                ),
                'forcedRls', (
                  select bool_and(class.relrowsecurity and class.relforcerowsecurity)
                  from pg_catalog.pg_class class
                  where class.oid in (
                    'public.storefront_payment_settings'::regclass,
                    'public.customer_order_payments'::regclass,
                    'public.customer_payment_attempts'::regclass,
                    'public.customer_payment_events'::regclass,
                    'public.customer_payment_mutations'::regclass,
                    'public.customer_payment_webhook_receipts'::regclass
                  )
                ),
                'clientTablesDenied', (
                  not has_table_privilege(
                    'authenticated', 'public.customer_order_payments',
                    'SELECT,INSERT,UPDATE,DELETE'
                  )
                  and not has_table_privilege(
                    'authenticated', 'public.customer_payment_events',
                    'SELECT,INSERT,UPDATE,DELETE'
                  )
                ),
                'serviceTransitionOnly', (
                  has_function_privilege(
                    'service_role',
                    'public.service_customer_payment_transition_v1(uuid,text,uuid,text,text,text)',
                    'EXECUTE'
                  )
                  and not has_function_privilege(
                    'authenticated',
                    'public.service_customer_payment_transition_v1(uuid,text,uuid,text,text,text)',
                    'EXECUTE'
                  )
                ),
                'onlineDefaultsOff', (
                  not exists (
                    select 1
                    from public.storefront_payment_settings payment
                    where payment.online_payment_enabled
                      or payment.online_provider <> 'none'
                  )
                ),
                'productionWriteRequested', false
              );" > _task032-evidence/post-verify.json
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const report = JSON.parse(
            readFileSync("_task032-evidence/post-verify.json", "utf8").trim(),
          );
          console.log(JSON.stringify(report));
          const { productionWriteRequested, ...proofs } = report;
          if (
            productionWriteRequested !== false ||
            Object.values(proofs).some((value) => value !== true)
          ) process.exit(1);
          NODE

      - name: Remove protected connection material
        if: always()
        run: rm -f _task032-db-url

      - name: Upload non-secret TASK-032 database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-032-customer-payments-${{ github.run_id }}-${{ github.run_attempt }}
          path: _task032-evidence
          if-no-files-found: error
          retention-days: 14
