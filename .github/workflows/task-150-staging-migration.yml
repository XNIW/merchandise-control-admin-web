name: TASK-150 Staging Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate or apply the single TASK-150 staging migration"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      apply_confirmation:
        description: "For apply, enter APPLY_TASK150_STAGING"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: task-150-staging-migration
  cancel-in-progress: false

env:
  SOURCE_POOLER_HOST: aws-1-sa-east-1.pooler.supabase.com
  EXPECTED_STAGING_SUPABASE_PROJECT_REF: jpgoimipbothfgkokyvm
  EXPECTED_MIGRATION_VERSION: "20260802015520"
  EXPECTED_MIGRATION_NAME: task_150_storage_cleanup_recovery
  EXPECTED_MIGRATION_FILE: 20260802015520_task_150_storage_cleanup_recovery.sql
  REMAPPED_LOCAL_MIGRATION_VERSION: "20260727055520"
  REMAPPED_REMOTE_MIGRATION_VERSION: "20260727084040"
  REMAPPED_MIGRATION_NAME: task_142_catalog_text_policy_v1
  REMAPPED_LOCAL_MIGRATION_FILE: 20260727055520_task_142_catalog_text_policy_v1.sql

jobs:
  migrate:
    name: Guarded dry-run and optional apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging

    env:
      ALLOWED_STAGING_SUPABASE_PROJECT_REFS: ${{ vars.ALLOWED_STAGING_SUPABASE_PROJECT_REFS }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4

      - name: Verify immutable staging inputs
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const ref = process.env.STAGING_SUPABASE_PROJECT_REF || "";
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL || "";
          const mode = process.env.REQUESTED_MODE || "";
          const allowed = (process.env.ALLOWED_STAGING_SUPABASE_PROJECT_REFS || "")
            .split(",")
            .map((value) => value.trim())
            .filter(Boolean);
          let urlMatchesProject = false;
          try {
            urlMatchesProject = new URL(url).hostname === `${ref}.supabase.co`;
          } catch {}
          const status = {
            mainBranch: process.env.GITHUB_REF === "refs/heads/main",
            projectRefShapeOk: /^[a-z0-9]{20}$/.test(ref),
            exactProject:
              ref === process.env.EXPECTED_STAGING_SUPABASE_PROJECT_REF,
            allowedProject: allowed.includes(ref),
            urlMatchesProject,
            databasePasswordPresent: Boolean(process.env.SUPABASE_DB_PASSWORD),
            supportedMode: mode === "dry-run" || mode === "apply",
            applyConfirmationOk:
              mode !== "apply" ||
              process.env.APPLY_CONFIRMATION === "APPLY_TASK150_STAGING",
          };
          console.log(JSON.stringify(status));
          if (Object.values(status).some((value) => !value)) process.exit(1);
          NODE

      - name: Build protected database URL
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p _task150-migration/evidence
          SOURCE_DB_URL="$(node <<'NODE'
          const ref = process.env.STAGING_SUPABASE_PROJECT_REF;
          const password = process.env.SUPABASE_DB_PASSWORD;
          const host = process.env.SOURCE_POOLER_HOST;
          if (!ref || !password || !host) process.exit(1);
          process.stdout.write(
            `postgresql://postgres.${ref}:${encodeURIComponent(password)}@${host}:5432/postgres?sslmode=require`,
          );
          NODE
          )"
          echo "::add-mask::$SOURCE_DB_URL"
          printf '%s' "$SOURCE_DB_URL" > _task150-migration/source-db-url
          chmod 600 _task150-migration/source-db-url

      - name: Prove exact remote-to-local migration delta
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _task150-migration/source-db-url)"
          docker run --rm -i --network host \
            -e SOURCE_DB_URL="$SOURCE_DB_URL" \
            postgres:17 \
            psql -X -qAt -F $'\t' -v ON_ERROR_STOP=1 \
              "$SOURCE_DB_URL" \
              -c "select version, name from supabase_migrations.schema_migrations order by version" \
              > _task150-migration/evidence/remote-ledger.tsv
          node scripts/task-150-reconcile-migration-delta.mjs \
            supabase/migrations \
            _task150-migration/evidence/remote-ledger.tsv \
            _task150-migration/evidence/delta.json

      - name: Materialize exact remote remap for the ephemeral CLI projection
        run: |
          set -euo pipefail
          LOCAL_PATH="supabase/migrations/$REMAPPED_LOCAL_MIGRATION_FILE"
          REMOTE_PATH="supabase/migrations/${REMAPPED_REMOTE_MIGRATION_VERSION}_${REMAPPED_MIGRATION_NAME}.sql"
          test -f "$LOCAL_PATH"
          test ! -e "$REMOTE_PATH"
          cp -- "$LOCAL_PATH" "$REMOTE_PATH"
          rm -- "$LOCAL_PATH"
          test -f "$REMOTE_PATH"
          test ! -e "$LOCAL_PATH"

      - name: Supabase CLI dry-run
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _task150-migration/source-db-url)"
          npx --yes supabase@2.109.0 \
            --workdir "$PWD" \
            db push \
            --dry-run \
            --db-url "$SOURCE_DB_URL" \
            2>&1 | tee _task150-migration/evidence/supabase-dry-run.txt
          grep -F "$EXPECTED_MIGRATION_VERSION" \
            _task150-migration/evidence/supabase-dry-run.txt
          if grep -F "$REMAPPED_LOCAL_MIGRATION_VERSION" \
            _task150-migration/evidence/supabase-dry-run.txt || \
            grep -F "$REMAPPED_REMOTE_MIGRATION_VERSION" \
              _task150-migration/evidence/supabase-dry-run.txt; then
            echo "Already-applied remapped migration appeared in dry-run." >&2
            exit 1
          fi

      - name: Apply single approved migration
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _task150-migration/source-db-url)"
          npx --yes supabase@2.109.0 \
            --workdir "$PWD" \
            db push \
            --db-url "$SOURCE_DB_URL" \
            --yes \
            2>&1 | tee _task150-migration/evidence/supabase-apply.txt
          grep -F "$EXPECTED_MIGRATION_VERSION" \
            _task150-migration/evidence/supabase-apply.txt
          if grep -F "$REMAPPED_LOCAL_MIGRATION_VERSION" \
            _task150-migration/evidence/supabase-apply.txt || \
            grep -F "$REMAPPED_REMOTE_MIGRATION_VERSION" \
              _task150-migration/evidence/supabase-apply.txt; then
            echo "Already-applied remapped migration appeared in apply output." >&2
            exit 1
          fi

      - name: Verify TASK-150 schema and grants
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _task150-migration/source-db-url)"
          docker run --rm -i --network host \
            -e SOURCE_DB_URL="$SOURCE_DB_URL" \
            postgres:17 \
            psql -X -qAt -v ON_ERROR_STOP=1 "$SOURCE_DB_URL" \
              > _task150-migration/evidence/post-verify.json <<'SQL'
          with public_functions as (
            select p.oid, p.prosrc, p.prosecdef, p.proconfig
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname::text = any(array[
                'task_150_win7pos_image_qa_begin_v1',
                'task_150_win7pos_image_qa_provision_admit_v1',
                'task_150_win7pos_image_qa_provision_v1',
                'task_150_win7pos_image_qa_prearm_v1',
                'task_150_win7pos_image_qa_rotation_prepare_v1',
                'task_150_win7pos_image_qa_rotation_ack_v1',
                'task_150_win7pos_image_qa_result_issue_v1',
                'task_150_win7pos_image_qa_cleanup_acquire_v1',
                'task_150_win7pos_image_qa_cleanup_acquire_v2',
                'task_150_win7pos_image_qa_cleanup_commit_v1',
                'task_150_win7pos_image_qa_result_v1'
              ]::text[])
          ), cleanup_acquire_private as (
            select p.oid, p.prosrc, p.prosecdef, p.proconfig
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'app_private'
              and p.proname = 'task_150_win7pos_image_qa_cleanup_acquire_impl'
              and p.oid = pg_catalog.to_regprocedure(
                'app_private.task_150_win7pos_image_qa_cleanup_acquire_impl(text,text,text,text,text,boolean)'
              )::oid
          ), cleanup_actor_revoke_private as (
            select p.oid, p.prosrc, p.prosecdef, p.proconfig
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'app_private'
              and p.proname = 'task_150_win7pos_image_qa_cleanup_revoke_actors_v1'
              and p.oid = pg_catalog.to_regprocedure(
                'app_private.task_150_win7pos_image_qa_cleanup_revoke_actors_v1(text)'
              )::oid
          ), storage_terminal_guard as (
            select
              p.oid,
              p.prosrc,
              p.prosecdef,
              p.proconfig,
              t.tgenabled,
              t.tgtype,
              pg_get_triggerdef(t.oid) as trigger_definition
            from pg_trigger t
            join pg_proc p on p.oid = t.tgfoid
            join pg_class c on c.oid = t.tgrelid
            join pg_namespace n on n.oid = c.relnamespace
            where not t.tgisinternal
              and t.tgname = 'task_150_qa_require_storage_absent_on_clean_trigger'
              and n.nspname = 'app_private'
              and c.relname = 'task_150_win7pos_image_qa_runs'
              and p.oid = pg_catalog.to_regprocedure(
                'app_private.task_150_qa_require_storage_absent_on_clean_v2()'
              )::oid
          ), private_tables as (
            select c.oid
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'app_private'
              and c.relname::text = any(array[
                'task_150_win7pos_image_qa_runs',
                'task_150_win7pos_image_qa_auth_assets',
                'task_150_win7pos_image_qa_budget_rows'
              ]::text[])
              and c.relkind = 'r'
          )
          select jsonb_build_object(
            'baseMigrationLedgerExact', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260731162000'
                and name = 'task_150_win7pos_product_image_qa_boundary'
            ),
            'compatMigrationLedgerExact', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260801024000'
                and name = 'task_150_opaque_secret_role_compat'
            ),
            'recoveryMigrationLedgerExact', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260802015520'
                and name = 'task_150_storage_cleanup_recovery'
            ),
            'publicFunctionCount', (select count(*) from public_functions),
            'opaqueSecretRoleCompat', (
              select bool_and(
                position(
                  'current_setting(''request.jwt.claim.role'', true)'
                  in prosrc
                ) > 0
                and position(
                  'current_setting(''role'', true)'
                  in prosrc
                ) > 0
              )
              from public_functions
            ),
            'cleanupAcquireLegacyExact', (
              select count(*) = 1
              from public_functions
              where oid = pg_catalog.to_regprocedure(
                  'public.task_150_win7pos_image_qa_cleanup_acquire_v1(text,text,text,text,text)'
                )::oid
                and position(
                  'app_private.task_150_win7pos_image_qa_cleanup_acquire_impl'
                  in prosrc
                ) > 0
                and prosrc ~ 'p_owner_digest,[[:space:]]+false[[:space:]]*\)'
            ) and (
              select count(*) = 1
              from cleanup_acquire_private
              where position(
                  'cleanup_capability_expires_at + interval ''6 hours'''
                  in prosrc
                ) > 0
                and position(
                  'not p_allow_storage_paths and exists'
                  in prosrc
                ) > 0
                and position(
                  '''/products/'' || v_run.run_product_id::text'
                  in prosrc
                ) > 0
                and position('storage_cleanup_incomplete' in prosrc) > 0
            ),
            'cleanupAcquireRecoveryExact', (
              select count(*) = 1
              from public_functions
              where oid = pg_catalog.to_regprocedure(
                  'public.task_150_win7pos_image_qa_cleanup_acquire_v2(text,text,text,text,text)'
                )::oid
                and position(
                  'app_private.task_150_win7pos_image_qa_cleanup_acquire_impl'
                  in prosrc
                ) > 0
                and prosrc ~ 'p_owner_digest,[[:space:]]+true[[:space:]]*\)'
            ) and (
              select count(*) = 1
              from cleanup_acquire_private
              where position('v_version_count > 2' in prosrc) > 0
                and position(
                  'p_allow_storage_paths and jsonb_array_length(v_paths) > 4'
                  in prosrc
                ) > 0
                and position('delete from storage.objects' in lower(prosrc)) = 0
                and position('update storage.objects' in lower(prosrc)) = 0
            ),
            'cleanupAcquirePrivateDenied', (
              select count(*) = 1
                and bool_and(prosecdef)
                and bool_and(
                  'search_path=""' = any(coalesce(proconfig, array[]::text[]))
                )
                and bool_and(
                  not has_function_privilege('service_role', oid, 'execute')
                )
                and bool_and(not has_function_privilege('anon', oid, 'execute'))
                and bool_and(
                  not has_function_privilege('authenticated', oid, 'execute')
                )
                and bool_and(
                  position(
                    'current_setting(''request.jwt.claim.role'', true)'
                    in prosrc
                  ) > 0
                  and position(
                    'current_setting(''role'', true)'
                    in prosrc
                  ) > 0
                )
              from cleanup_acquire_private
            ),
            'cleanupInvariantActorRevocation', (
              select count(*) = 1
                and bool_and(prosecdef)
                and bool_and(
                  'search_path=""' = any(coalesce(proconfig, array[]::text[]))
                )
                and bool_and(
                  not has_function_privilege('service_role', oid, 'execute')
                )
                and bool_and(not has_function_privilege('anon', oid, 'execute'))
                and bool_and(
                  not has_function_privilege('authenticated', oid, 'execute')
                )
                and bool_and(position('update public.pos_sessions' in prosrc) > 0)
                and bool_and(
                  position('update public.pos_device_credentials' in prosrc) > 0
                )
                and bool_and(position('update public.shop_devices' in prosrc) > 0)
                and bool_and(position('update public.staff_accounts' in prosrc) > 0)
              from cleanup_actor_revoke_private
            ) and (
              select count(*) = 1
                and bool_and(
                  position(
                    'task_150_win7pos_image_qa_cleanup_revoke_actors_v1'
                    in prosrc
                  ) > 0
                )
              from cleanup_acquire_private
            ),
            'cleanupTerminalStorageGuard', (
              select count(*) = 1
                and bool_and(tgenabled = 'O')
                and bool_and(tgtype = 19)
                and bool_and(
                  position('BEFORE UPDATE OF status ON' in trigger_definition) > 0
                )
                and bool_and(
                  position('FOR EACH ROW EXECUTE FUNCTION' in trigger_definition) > 0
                )
                and bool_and(prosecdef)
                and bool_and(
                  'search_path=""' = any(coalesce(proconfig, array[]::text[]))
                )
                and bool_and(
                  not has_function_privilege('service_role', oid, 'execute')
                )
                and bool_and(
                  position('new.status = ''cleaned''' in prosrc) > 0
                )
                and bool_and(position('storage.objects' in prosrc) > 0)
                and bool_and(
                  position(
                    '''/products/'' || new.run_product_id::text'
                    in prosrc
                  ) > 0
                )
              from storage_terminal_guard
            ),
            'securityDefinerAndSafeSearchPath', (
              select bool_and(
                prosecdef
                and 'search_path=""' = any(
                  coalesce(proconfig, array[]::text[])
                )
              )
              from public_functions
            ),
            'serviceRoleExecute', (
              select bool_and(has_function_privilege('service_role', oid, 'execute'))
              from public_functions
            ),
            'anonExecuteDenied', (
              select bool_and(not has_function_privilege('anon', oid, 'execute'))
              from public_functions
            ),
            'authenticatedExecuteDenied', (
              select bool_and(not has_function_privilege('authenticated', oid, 'execute'))
              from public_functions
            ),
            'privateTableCount', (select count(*) from private_tables),
            'serviceRoleSelect', (
              select bool_and(has_table_privilege('service_role', oid, 'select'))
              from private_tables
            ),
            'serviceRoleDirectMutationDenied', (
              select bool_and(
                not has_table_privilege('service_role', oid, 'insert') and
                not has_table_privilege('service_role', oid, 'update') and
                not has_table_privilege('service_role', oid, 'delete') and
                not has_table_privilege('service_role', oid, 'truncate')
              ) from private_tables
            ),
            'anonDirectAccessDenied', (
              select bool_and(not has_table_privilege('anon', oid, 'select,insert,update,delete,truncate'))
              from private_tables
            ),
            'authenticatedDirectAccessDenied', (
              select bool_and(not has_table_privilege('authenticated', oid, 'select,insert,update,delete,truncate'))
              from private_tables
            )
          );
          SQL
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const report = JSON.parse(
            readFileSync("_task150-migration/evidence/post-verify.json", "utf8"),
          );
          console.log(JSON.stringify(report));
          const requiredTrue = [
            "baseMigrationLedgerExact",
            "compatMigrationLedgerExact",
            "recoveryMigrationLedgerExact",
            "opaqueSecretRoleCompat",
            "cleanupAcquireLegacyExact",
            "cleanupAcquireRecoveryExact",
            "cleanupAcquirePrivateDenied",
            "cleanupInvariantActorRevocation",
            "cleanupTerminalStorageGuard",
            "securityDefinerAndSafeSearchPath",
            "serviceRoleExecute",
            "anonExecuteDenied",
            "authenticatedExecuteDenied",
            "serviceRoleSelect",
            "serviceRoleDirectMutationDenied",
            "anonDirectAccessDenied",
            "authenticatedDirectAccessDenied",
          ];
          if (
            requiredTrue.some((key) => report[key] !== true) ||
            Number(report.publicFunctionCount) !== 11 ||
            Number(report.privateTableCount) !== 3
          ) process.exit(1);
          NODE

      - name: Remove protected connection material
        if: always()
        run: rm -f _task150-migration/source-db-url

      - name: Upload non-secret migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-150-staging-migration-${{ github.run_id }}
          path: _task150-migration/evidence
          if-no-files-found: error
          retention-days: 14
