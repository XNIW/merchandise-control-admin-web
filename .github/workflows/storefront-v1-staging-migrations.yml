name: Storefront V1 Staging Migrations

on:
  workflow_call:
    inputs:
      mode:
        description: "Validate only, or apply the approved Storefront migration"
        required: true
        type: string
      expected_head_sha:
        description: "Exact integration/storefront-v1 commit to deploy"
        required: true
        type: string
      expected_migration_version:
        description: "Exact additive migration version expected in the delta"
        required: false
        default: "20260802043000"
        type: string
      expected_migration_name:
        description: "Exact additive migration name expected in the delta"
        required: false
        default: storefront_v1_catalog_performance
        type: string
      expected_migration_file:
        description: "Exact additive migration filename expected in the delta"
        required: false
        default: 20260802043000_storefront_v1_catalog_performance.sql
        type: string
      apply_confirmation:
        description: "For apply, enter APPLY_STOREFRONT_V1_STAGING"
        required: false
        type: string
      load_hold_seconds:
        description: "Bounded TASK-019 fixture window for headless client profiling"
        required: false
        default: "0"
        type: string
      run_performance_load:
        description: "Run the bounded TASK-019 20k-row performance fixture"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate only, or apply the approved Storefront migration"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      expected_head_sha:
        description: "Exact integration/storefront-v1 commit to deploy"
        required: true
        type: string
      expected_migration_version:
        description: "Exact additive migration version expected in the delta"
        required: true
        default: "20260802043000"
        type: string
      expected_migration_name:
        description: "Exact additive migration name expected in the delta"
        required: true
        default: storefront_v1_catalog_performance
        type: string
      expected_migration_file:
        description: "Exact additive migration filename expected in the delta"
        required: true
        default: 20260802043000_storefront_v1_catalog_performance.sql
        type: string
      apply_confirmation:
        description: "For apply, enter APPLY_STOREFRONT_V1_STAGING"
        required: false
        type: string
      load_hold_seconds:
        description: "Bounded TASK-019 fixture window in seconds (0..900)"
        required: false
        default: "0"
        type: string
      run_performance_load:
        description: "Run the bounded TASK-019 20k-row performance fixture"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: storefront-v1-staging-migrations
  cancel-in-progress: false

env:
  SOURCE_POOLER_HOST: aws-1-sa-east-1.pooler.supabase.com
  EXPECTED_MIGRATION_VERSION: ${{ inputs.expected_migration_version }}
  EXPECTED_MIGRATION_NAME: ${{ inputs.expected_migration_name }}
  EXPECTED_MIGRATION_FILE: ${{ inputs.expected_migration_file }}
  REMAPPED_LOCAL_MIGRATION_VERSION: "20260727055520"
  REMAPPED_REMOTE_MIGRATION_VERSION: "20260727084040"
  REMAPPED_MIGRATION_NAME: task_142_catalog_text_policy_v1
  REMAPPED_LOCAL_MIGRATION_FILE: 20260727055520_task_142_catalog_text_policy_v1.sql
  ALLOW_EXPECTED_ALREADY_APPLIED: "true"

jobs:
  migrate:
    name: Guarded Storefront dry-run and optional apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging

    env:
      ALLOWED_STAGING_SUPABASE_PROJECT_REFS: ${{ vars.ALLOWED_STAGING_SUPABASE_PROJECT_REFS }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4

      - name: Verify immutable staging inputs
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const ref = process.env.STAGING_SUPABASE_PROJECT_REF || "";
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL || "";
          const mode = process.env.REQUESTED_MODE || "";
          const expectedHead = process.env.EXPECTED_HEAD_SHA || "";
          const allowed = (process.env.ALLOWED_STAGING_SUPABASE_PROJECT_REFS || "")
            .split(",")
            .map((value) => value.trim())
            .filter(Boolean);
          let urlMatchesProject = false;
          try {
            urlMatchesProject = new URL(url).hostname === `${ref}.supabase.co`;
          } catch {}
          const status = {
            integrationBranch:
              process.env.GITHUB_REF === "refs/heads/integration/storefront-v1",
            exactHead:
              /^[0-9a-f]{40}$/.test(expectedHead) &&
              process.env.GITHUB_SHA === expectedHead,
            projectRefShapeOk: /^[a-z0-9]{20}$/.test(ref),
            allowedProject: allowed.includes(ref),
            urlMatchesProject,
            databasePasswordPresent: Boolean(process.env.SUPABASE_DB_PASSWORD),
            supportedMode: mode === "dry-run" || mode === "apply",
            applyConfirmationOk:
              mode !== "apply" ||
              process.env.APPLY_CONFIRMATION === "APPLY_STOREFRONT_V1_STAGING",
          };
          console.log(JSON.stringify(status));
          if (Object.values(status).some((value) => !value)) process.exit(1);
          NODE

      - name: Build protected database URL
        run: |
          set -euo pipefail
          mkdir -p _storefront-migration/evidence
          SOURCE_DB_URL="$(node <<'NODE'
          const ref = process.env.STAGING_SUPABASE_PROJECT_REF;
          const password = process.env.SUPABASE_DB_PASSWORD;
          const host = process.env.SOURCE_POOLER_HOST;
          if (!ref || !password || !host) process.exit(1);
          process.stdout.write(`postgresql://postgres.${ref}:${encodeURIComponent(password)}@${host}:5432/postgres?sslmode=require`);
          NODE
          )"
          echo "::add-mask::$SOURCE_DB_URL"
          printf '%s' "$SOURCE_DB_URL" > _storefront-migration/source-db-url
          chmod 600 _storefront-migration/source-db-url

      - name: Prove exact remote-to-local migration delta
        id: migration_delta
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _storefront-migration/source-db-url)"
          docker run --rm --network host \
            -e SOURCE_DB_URL="$SOURCE_DB_URL" \
            postgres:17 \
            psql -X -qAt -F $'\t' -v ON_ERROR_STOP=1 \
              "$SOURCE_DB_URL" \
              -c "select version, name from supabase_migrations.schema_migrations order by version" \
              > _storefront-migration/evidence/remote-ledger.tsv
          node scripts/task-150-reconcile-migration-delta.mjs \
            supabase/migrations \
            _storefront-migration/evidence/remote-ledger.tsv \
            _storefront-migration/evidence/delta.json
          EXPECTED_STATE="$(node -e '
          const report = require("./_storefront-migration/evidence/delta.json");
          if (!["pending", "applied"].includes(report.expectedState)) process.exit(1);
          process.stdout.write(report.expectedState);
          ')"
          printf 'expected_state=%s\n' "$EXPECTED_STATE" >> "$GITHUB_OUTPUT"

      - name: Materialize approved remote remap for CLI parity
        run: |
          set -euo pipefail
          LOCAL_PATH="supabase/migrations/$REMAPPED_LOCAL_MIGRATION_FILE"
          REMOTE_PATH="supabase/migrations/${REMAPPED_REMOTE_MIGRATION_VERSION}_${REMAPPED_MIGRATION_NAME}.sql"
          test -f "$LOCAL_PATH"
          test ! -e "$REMOTE_PATH"
          cp -- "$LOCAL_PATH" "$REMOTE_PATH"
          rm -- "$LOCAL_PATH"
          test -f "$REMOTE_PATH"
          test ! -e "$LOCAL_PATH"

      - name: Supabase CLI dry-run
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _storefront-migration/source-db-url)"
          npx --yes supabase@2.111.0 \
            --workdir "$PWD" \
            db push \
            --dry-run \
            --db-url "$SOURCE_DB_URL" \
            2>&1 | tee _storefront-migration/evidence/supabase-dry-run.txt
          if [[ "${{ steps.migration_delta.outputs.expected_state }}" == "pending" ]]; then
            grep -F "$EXPECTED_MIGRATION_VERSION" \
              _storefront-migration/evidence/supabase-dry-run.txt
          fi
          if grep -F "$REMAPPED_LOCAL_MIGRATION_VERSION" \
            _storefront-migration/evidence/supabase-dry-run.txt || \
            grep -F "$REMAPPED_REMOTE_MIGRATION_VERSION" \
              _storefront-migration/evidence/supabase-dry-run.txt; then
            echo "Already-applied remapped migration appeared in dry-run." >&2
            exit 1
          fi
          sed -i \
            -e "s/$STAGING_SUPABASE_PROJECT_REF/[STAGING_REF]/g" \
            -e "s/$SOURCE_POOLER_HOST/[POOLER_HOST]/g" \
            _storefront-migration/evidence/supabase-dry-run.txt

      - name: Apply approved Storefront migration
        if: >-
          inputs.mode == 'apply' &&
          steps.migration_delta.outputs.expected_state == 'pending'
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _storefront-migration/source-db-url)"
          npx --yes supabase@2.111.0 \
            --workdir "$PWD" \
            db push \
            --db-url "$SOURCE_DB_URL" \
            --yes \
            2>&1 | tee _storefront-migration/evidence/supabase-apply.txt
          grep -F "$EXPECTED_MIGRATION_VERSION" \
            _storefront-migration/evidence/supabase-apply.txt
          if grep -F "$REMAPPED_LOCAL_MIGRATION_VERSION" \
            _storefront-migration/evidence/supabase-apply.txt || \
            grep -F "$REMAPPED_REMOTE_MIGRATION_VERSION" \
              _storefront-migration/evidence/supabase-apply.txt; then
            echo "Already-applied remapped migration appeared in apply." >&2
            exit 1
          fi
          sed -i \
            -e "s/$STAGING_SUPABASE_PROJECT_REF/[STAGING_REF]/g" \
            -e "s/$SOURCE_POOLER_HOST/[POOLER_HOST]/g" \
            _storefront-migration/evidence/supabase-apply.txt

      - name: Verify Storefront public API, projection boundary and safe defaults
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _storefront-migration/source-db-url)"
          cat > _storefront-migration/post-verify.sql <<'SQL'
          select jsonb_pretty(jsonb_build_object(
            'migrationLedgerExact', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260802043000'
                and name = 'storefront_v1_catalog_performance'
            ),
            'catalogVersionLedgerRetained', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260802033000'
                and name = 'storefront_v1_catalog_version_contract'
            ),
            'publicImagesLedgerRetained', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260802023000'
                and name = 'storefront_v1_public_images'
            ),
            'adminPromotionsLedgerRetained', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260802010000'
                and name = 'storefront_v1_admin_promotions'
            ),
            'adminPublicationsLedgerRetained', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260802001000'
                and name = 'storefront_v1_admin_publications'
            ),
            'publicApiPlannerLedgerRetained', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260801230000'
                and name = 'storefront_v1_public_api_planner'
            ),
            'publicApiLedgerRetained', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260801223000'
                and name = 'storefront_v1_public_api'
            ),
            'projectionGrantRepairRetained', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260801213500'
                and name = 'storefront_v1_catalog_projection_grants'
            ),
            'projectionLedgerRetained', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260801211500'
                and name = 'storefront_v1_catalog_projection'
            ),
            'task005LedgerRetained', (
              select count(*) = 1
              from supabase_migrations.schema_migrations
              where version = '20260801195852'
                and name = 'storefront_v1_schema_rls'
            ),
            'projectionTableCount', (
              select count(*)
              from pg_catalog.pg_class class
              join pg_catalog.pg_namespace namespace
                on namespace.oid = class.relnamespace
              where namespace.nspname = 'public'
                and class.relkind = 'r'
                and class.relname in (
                  'storefront_catalog_items',
                  'storefront_catalog_versions'
                )
            ),
            'rlsForcedCount', (
              select count(*)
              from pg_catalog.pg_class class
              join pg_catalog.pg_namespace namespace
                on namespace.oid = class.relnamespace
              where namespace.nspname = 'public'
                and class.relname in (
                  'storefront_catalog_items',
                  'storefront_catalog_versions'
                )
                and class.relkind = 'r'
                and class.relrowsecurity
                and class.relforcerowsecurity
            ),
            'projectionPolicyCount', (
              select count(*)
              from pg_catalog.pg_policy policy
              join pg_catalog.pg_class class on class.oid = policy.polrelid
              join pg_catalog.pg_namespace namespace
                on namespace.oid = class.relnamespace
              where namespace.nspname = 'public'
                and class.relname in (
                  'storefront_catalog_items',
                  'storefront_catalog_versions'
                )
            ),
            'anonProjectionDenied',
              not has_table_privilege(
                'anon',
                'public.storefront_catalog_items',
                'SELECT,INSERT,UPDATE,DELETE'
              ),
            'authenticatedProjectionDenied',
              not has_table_privilege(
                'authenticated',
                'public.storefront_catalog_items',
                'SELECT,INSERT,UPDATE,DELETE'
              ),
            'serviceRoleProjectionBoundary',
              has_table_privilege(
                'service_role',
                'public.storefront_catalog_items',
                'SELECT'
              )
              and not has_table_privilege(
                'service_role',
                'public.storefront_catalog_items',
                'INSERT,UPDATE,DELETE'
              ),
            'projectionPriceIsBigint', (
              select data_type = 'bigint'
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'storefront_catalog_items'
                and column_name = 'price_clp'
            ),
            'internalColumnsAbsent', not exists (
              select 1
              from information_schema.columns
              where table_schema = 'public'
                and table_name = 'storefront_catalog_items'
                and column_name in (
                  'source_product_id',
                  'owner_user_id',
                  'supplier_id',
                  'purchase_price',
                  'stock_quantity',
                  'source_image_version_id',
                  'main_path',
                  'thumb_path'
                )
            ),
            'projectionFunctionsHardened', (
              select count(*) = 7
              from pg_catalog.pg_proc procedure
              join pg_catalog.pg_namespace namespace
                on namespace.oid = procedure.pronamespace
              where namespace.nspname = 'app_private'
                and procedure.proname like 'storefront_catalog_%_v1'
                and procedure.prosecdef
                and procedure.proconfig = array['search_path=""']
            ),
            'publicApiFunctionCount', (
              select count(*) = 9
              from pg_catalog.pg_proc procedure
              join pg_catalog.pg_namespace namespace
                on namespace.oid = procedure.pronamespace
              where namespace.nspname = 'public'
                and procedure.proname in (
                  'storefront_catalog_version_v1',
                  'storefront_settings_v1',
                  'storefront_categories_v1',
                  'storefront_catalog_v1',
                  'storefront_search_v1',
                  'storefront_product_detail_v1',
                  'storefront_featured_v1',
                  'storefront_offers_v1',
                  'storefront_home_v1'
                )
                and procedure.prosecdef
                and procedure.provolatile = 's'
                and 'search_path=""' = any(procedure.proconfig)
                and 'statement_timeout=3s' = any(procedure.proconfig)
            ),
            'publicApiMobileExecute',
              has_function_privilege(
                'anon',
                'public.storefront_catalog_v1(text,text,integer,text,text,boolean,boolean,text)',
                'EXECUTE'
              )
              and has_function_privilege(
                'authenticated',
                'public.storefront_search_v1(text,text,text,integer,text)',
                'EXECUTE'
              ),
            'privateApiHelpersDenied',
              not has_function_privilege(
                'anon',
                'app_private.storefront_public_shop_v1(text)',
                'EXECUTE'
              )
              and not has_function_privilege(
                'authenticated',
                'app_private.storefront_cursor_decode_v1(text)',
                'EXECUTE'
              ),
            'readResolverPlannerSafe', (
              select not procedure.prosecdef
                and procedure.proconfig is null
                and not has_function_privilege(
                  'anon',
                  procedure.oid,
                  'EXECUTE'
                )
                and not has_function_privilege(
                  'authenticated',
                  procedure.oid,
                  'EXECUTE'
                )
              from pg_catalog.pg_proc procedure
              join pg_catalog.pg_namespace namespace
                on namespace.oid = procedure.pronamespace
              where namespace.nspname = 'app_private'
                and procedure.proname = 'storefront_public_catalog_rows_v1'
                and pg_catalog.pg_get_function_identity_arguments(procedure.oid)
                  = 'p_shop_id uuid, p_at timestamp with time zone'
            ),
            'publicSearchFieldsPresent', (
              select count(*) = 4
              from information_schema.columns
              where table_schema = 'public'
                and (
                  (
                    table_name = 'storefront_product_publications'
                    and column_name in ('public_barcode', 'public_search_aliases')
                  )
                  or (
                    table_name = 'storefront_catalog_items'
                    and column_name in ('public_barcode', 'public_search_aliases')
                  )
                )
            ),
            'publicKeysetIndexesPresent', (
              select count(*) = 2
              from pg_catalog.pg_indexes
              where schemaname = 'public'
                and indexname in (
                  'storefront_catalog_items_shop_catalog_keyset_v1_idx',
                  'storefront_catalog_items_shop_name_keyset_v1_idx'
                )
            ),
            'adminRpcBoundary', (
              select count(*) = 2
              from pg_catalog.pg_proc procedure
              join pg_catalog.pg_namespace namespace
                on namespace.oid = procedure.pronamespace
              where namespace.nspname = 'public'
                and procedure.proname in (
                  'admin_storefront_publications_read_v1',
                  'admin_storefront_publication_mutate_v1'
                )
                and procedure.prosecdef
                and procedure.provolatile = 'v'
                and 'search_path=""' = any(procedure.proconfig)
                and 'statement_timeout=5s' = any(procedure.proconfig)
                and not has_function_privilege(
                  'anon',
                  procedure.oid,
                  'EXECUTE'
                )
                and has_function_privilege(
                  'authenticated',
                  procedure.oid,
                  'EXECUTE'
                )
            ),
            'adminPromotionRpcBoundary', (
              select count(*) = 2
              from pg_catalog.pg_proc procedure
              join pg_catalog.pg_namespace namespace
                on namespace.oid = procedure.pronamespace
              where namespace.nspname = 'public'
                and procedure.proname in (
                  'admin_storefront_promotions_read_v1',
                  'admin_storefront_promotion_mutate_v1'
                )
                and procedure.prosecdef
                and procedure.provolatile = 'v'
                and 'search_path=""' = any(procedure.proconfig)
                and not has_function_privilege(
                  'anon',
                  procedure.oid,
                  'EXECUTE'
                )
                and has_function_privilege(
                  'authenticated',
                  procedure.oid,
                  'EXECUTE'
                )
            ),
            'publicImageBucketBoundary', (
              select count(*) = 1
              from storage.buckets
              where id = 'storefront-product-images'
                and public
                and file_size_limit = 921600
                and allowed_mime_types = array['image/webp']::text[]
            ),
            'publicImageVariantBoundary', (
              select class.relrowsecurity
                and class.relforcerowsecurity
                and not has_table_privilege(
                  'anon',
                  'public.storefront_image_publication_variants',
                  'SELECT,INSERT,UPDATE,DELETE'
                )
                and not has_table_privilege(
                  'authenticated',
                  'public.storefront_image_publication_variants',
                  'SELECT,INSERT,UPDATE,DELETE'
                )
                and has_table_privilege(
                  'service_role',
                  'public.storefront_image_publication_variants',
                  'SELECT,INSERT,UPDATE,DELETE'
                )
              from pg_catalog.pg_class class
              join pg_catalog.pg_namespace namespace
                on namespace.oid = class.relnamespace
              where namespace.nspname = 'public'
                and class.relname = 'storefront_image_publication_variants'
            ),
            'publicImageAdminFunctionsHardened', (
              select count(*) = 5
              from pg_catalog.pg_proc procedure
              join pg_catalog.pg_namespace namespace
                on namespace.oid = procedure.pronamespace
              where namespace.nspname = 'public'
                and procedure.proname in (
                  'admin_storefront_images_read_v1',
                  'admin_storefront_image_source_read_v1',
                  'admin_storefront_image_intent_v1',
                  'admin_storefront_image_finalize_v1',
                  'admin_storefront_image_rollback_v1'
                )
                and procedure.prosecdef
                and 'search_path=""' = any(procedure.proconfig)
                and exists (
                  select 1
                  from unnest(procedure.proconfig) setting
                  where setting like 'statement_timeout=%'
                )
                and not has_function_privilege(
                  'anon',
                  procedure.oid,
                  'EXECUTE'
                )
                and has_function_privilege(
                  'authenticated',
                  procedure.oid,
                  'EXECUTE'
                )
            ),
            'publicImageServiceFunctionsConfined', (
              select count(*) = 3
              from pg_catalog.pg_proc procedure
              join pg_catalog.pg_namespace namespace
                on namespace.oid = procedure.pronamespace
              where namespace.nspname = 'public'
                and procedure.proname in (
                  'storefront_image_configure_origin_v1',
                  'storefront_image_cleanup_claim_v1',
                  'storefront_image_cleanup_complete_v1'
                )
                and procedure.prosecdef
                and 'search_path=""' = any(procedure.proconfig)
                and exists (
                  select 1
                  from unnest(procedure.proconfig) setting
                  where setting like 'statement_timeout=%'
                )
                and not has_function_privilege(
                  'anon',
                  procedure.oid,
                  'EXECUTE'
                )
                and not has_function_privilege(
                  'authenticated',
                  procedure.oid,
                  'EXECUTE'
                )
                and has_function_privilege(
                  'service_role',
                  procedure.oid,
                  'EXECUTE'
                )
            ),
            'promotionCronScheduled', (
              select count(*) = 1
              from cron.job
              where jobname = 'storefront-promotion-reconcile-v1'
                and schedule = '* * * * *'
            ),
            'adminAuthoringDirectDenied',
              not has_table_privilege(
                'authenticated',
                'public.storefront_product_publications',
                'INSERT,UPDATE,DELETE'
              ),
            'storefrontPermissionMatrix', (
              select count(*) = 8
              from app_private.mac_admin_w7pos_009_pos_admin_permissions()
              where permission_key like 'storefront.%'
            ),
            'statementTriggerCount', (
              select count(*) = 18
              from pg_catalog.pg_trigger trigger
              join pg_catalog.pg_class class on class.oid = trigger.tgrelid
              join pg_catalog.pg_namespace namespace
                on namespace.oid = class.relnamespace
              where namespace.nspname = 'public'
                and not trigger.tgisinternal
                and trigger.tgname like 'storefront_%_catalog_%'
            ),
            'searchExtensionsPresent', (
              select count(*) = 2
              from pg_catalog.pg_extension
              where extname in ('unaccent', 'pg_trgm')
            )
          ));
          SQL
          docker run --rm --network host \
            -e SOURCE_DB_URL="$SOURCE_DB_URL" \
            -v "$PWD/_storefront-migration:/migration" \
            postgres:17 \
            psql -X -qAt -v ON_ERROR_STOP=1 \
              "$SOURCE_DB_URL" \
