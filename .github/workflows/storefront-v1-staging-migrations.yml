            serviceRoleBoundary: report.serviceRoleBoundary === true,
            mobileIngestDenied: report.mobileIngestDenied === true,
            resolverShared: report.resolverShared === true,
            ingestHardened: report.ingestHardened === true,
            pgTapPlan: /^1\.\.44$/m.test(tap),
            pgTapAssertions: (tap.match(/^ok \d+ - /gm) || []).length === 44,
            pgTapNoFailures: !/^not ok /m.test(tap),
            concurrency:
              /one apply, one duplicate, final version 2, PASS/.test(
                concurrency,
              ),
          };
          console.log(JSON.stringify(checks));
          if (Object.values(checks).some((value) => !value)) process.exit(1);
          NODE

      - name: Verify TASK-025 atomic reservation-hold contract
        if: >-
          inputs.mode == 'apply' &&
          inputs.expected_migration_version == '20260803003855'
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _storefront-migration/source-db-url)"
          docker run --rm --network host \
            -e SOURCE_DB_URL="$SOURCE_DB_URL" \
            -v "$PWD:/workspace:ro" \
            postgres:17 \
            psql -X -qAt -v ON_ERROR_STOP=1 \
              "$SOURCE_DB_URL" \
              -f /workspace/supabase/tests/storefront_v1_reservation_holds.sql \
              > _storefront-migration/evidence/task-025-pgtap.txt
          docker run --rm --network host \
            -e STOREFRONT_RESERVATION_HOLD_DB_URL="$SOURCE_DB_URL" \
            -e STOREFRONT_RESERVATION_HOLD_ALLOW_REMOTE=APPLY_STOREFRONT_V1_STAGING_RESERVATION_HOLD \
            -e STAGING_SUPABASE_PROJECT_REF="$STAGING_SUPABASE_PROJECT_REF" \
            -v "$PWD:/workspace:ro" \
            postgres:17 \
            bash /workspace/scripts/testing/storefront-v1-reservation-hold-concurrency.sh \
              > _storefront-migration/evidence/task-025-concurrency.txt
          docker run --rm --network host \
            -e SOURCE_DB_URL="$SOURCE_DB_URL" \
            postgres:17 \
            psql -X -qAt -v ON_ERROR_STOP=1 \
              "$SOURCE_DB_URL" \
              -c "select jsonb_build_object(
                'migrationLedgerExact', (
                  select count(*) = 1
                  from supabase_migrations.schema_migrations
                  where version = '20260803003855'
                    and name = 'storefront_v1_reservation_hold_eligibility'
                ),
                'tableCount', (
                  select count(*)
                  from pg_catalog.pg_class class
                  join pg_catalog.pg_namespace namespace
                    on namespace.oid = class.relnamespace
                  where namespace.nspname = 'public'
                    and class.relname in (
                      'customer_reservation_holds',
                      'customer_reservation_hold_mutations'
                    )
                    and class.relkind = 'r'
                ),
                'rlsForcedCount', (
                  select count(*)
                  from pg_catalog.pg_class class
                  where class.oid in (
                    'public.customer_reservation_holds'::regclass,
                    'public.customer_reservation_hold_mutations'::regclass
                  )
                    and class.relrowsecurity
                    and class.relforcerowsecurity
                ),
                'policyCount', (
                  select count(*)
                  from pg_catalog.pg_policy policy
                  where policy.polrelid in (
                    'public.customer_reservation_holds'::regclass,
                    'public.customer_reservation_hold_mutations'::regclass
                  )
                ),
                'mobileTableDenied',
                  not has_table_privilege(
                    'anon', 'public.customer_reservation_holds',
                    'SELECT,INSERT,UPDATE,DELETE'
                  )
                  and not has_table_privilege(
                    'authenticated', 'public.customer_reservation_holds',
                    'SELECT,INSERT,UPDATE,DELETE'
                  )
                  and not has_table_privilege(
                    'authenticated',
                    'public.customer_reservation_hold_mutations',
                    'SELECT,INSERT,UPDATE,DELETE'
                  ),
                'serviceRoleTableBoundary',
                  has_table_privilege(
                    'service_role', 'public.customer_reservation_holds',
                    'SELECT,INSERT,UPDATE,DELETE'
                  )
                  and has_table_privilege(
                    'service_role',
                    'public.customer_reservation_hold_mutations',
                    'SELECT,INSERT,UPDATE,DELETE'
                  ),
                'rpcCount', (
                  select count(*)
                  from pg_catalog.pg_proc procedure
                  join pg_catalog.pg_namespace namespace
                    on namespace.oid = procedure.pronamespace
                  where namespace.nspname = 'public'
                    and procedure.proname in (
                      'customer_reservation_hold_create_v1',
                      'customer_reservation_hold_read_v1',
                      'customer_reservation_hold_release_v1'
                    )
                ),
                'rpcHardened', (
                  select count(*) = 3
                  from pg_catalog.pg_proc procedure
                  join pg_catalog.pg_namespace namespace
                    on namespace.oid = procedure.pronamespace
                  where namespace.nspname = 'public'
                    and procedure.proname in (
                      'customer_reservation_hold_create_v1',
                      'customer_reservation_hold_read_v1',
                      'customer_reservation_hold_release_v1'
                    )
                    and procedure.prosecdef
                    and (
                      'search_path='
                      || pg_catalog.chr(34)
                      || pg_catalog.chr(34)
                    ) = any(procedure.proconfig)
                ),
                'anonRpcDenied',
                  not has_function_privilege(
                    'anon',
                    'public.customer_reservation_hold_create_v1(text,uuid,integer,uuid)',
                    'EXECUTE'
                  )
                  and not has_function_privilege(
                    'anon',
                    'public.customer_reservation_hold_read_v1(uuid)',
                    'EXECUTE'
                  )
                  and not has_function_privilege(
                    'anon',
                    'public.customer_reservation_hold_release_v1(uuid,uuid)',
                    'EXECUTE'
                  ),
                'authenticatedRpcAllowed',
                  has_function_privilege(
                    'authenticated',
                    'public.customer_reservation_hold_create_v1(text,uuid,integer,uuid)',
                    'EXECUTE'
                  )
                  and has_function_privilege(
                    'authenticated',
                    'public.customer_reservation_hold_read_v1(uuid)',
                    'EXECUTE'
                  )
                  and has_function_privilege(
                    'authenticated',
                    'public.customer_reservation_hold_release_v1(uuid,uuid)',
                    'EXECUTE'
                  ),
                'serverDerivedArguments', not exists (
                  select 1
                  from pg_catalog.pg_proc procedure
                  join pg_catalog.pg_namespace namespace
                    on namespace.oid = procedure.pronamespace
                  cross join lateral unnest(
                    coalesce(procedure.proargnames, '{}'::text[])
                  ) argument(name)
                  where namespace.nspname = 'public'
                    and procedure.proname in (
                      'customer_reservation_hold_create_v1',
                      'customer_reservation_hold_read_v1',
                      'customer_reservation_hold_release_v1'
                    )
                    and argument.name ~*
                      '(user_id|shop_id|source_product|expires|stock|price|total|discount)'
                ),
                'inventoryFloorTrigger', exists (
                  select 1
                  from pg_catalog.pg_trigger trigger
                  where trigger.tgrelid = 'public.inventory_products'::regclass
                    and trigger.tgname =
                      'storefront_reservation_inventory_floor_guard'
                    and trigger.tgenabled = 'O'
                ),
                'expiryCronScheduled', exists (
                  select 1
                  from cron.job
                  where jobname = 'storefront-reservation-hold-expire-v1'
                    and schedule = '* * * * *'
                )
              )" \
              > _storefront-migration/evidence/task-025-post-verify.json
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const tap = readFileSync(
            "_storefront-migration/evidence/task-025-pgtap.txt",
            "utf8",
          );
          const concurrency = readFileSync(
            "_storefront-migration/evidence/task-025-concurrency.txt",
            "utf8",
          );
          const report = JSON.parse(
            readFileSync(
              "_storefront-migration/evidence/task-025-post-verify.json",
              "utf8",
            ),
          );
          const checks = {
            migrationLedgerExact: report.migrationLedgerExact === true,
            tableCount: Number(report.tableCount) === 2,
            rlsForcedCount: Number(report.rlsForcedCount) === 2,
            policyCount: Number(report.policyCount) === 8,
            mobileTableDenied: report.mobileTableDenied === true,
            serviceRoleTableBoundary:
              report.serviceRoleTableBoundary === true,
            rpcCount: Number(report.rpcCount) === 3,
            rpcHardened: report.rpcHardened === true,
            anonRpcDenied: report.anonRpcDenied === true,
            authenticatedRpcAllowed:
              report.authenticatedRpcAllowed === true,
            serverDerivedArguments:
              report.serverDerivedArguments === true,
            inventoryFloorTrigger: report.inventoryFloorTrigger === true,
            expiryCronScheduled: report.expiryCronScheduled === true,
            pgTapPlan: /^1\.\.54$/m.test(tap),
            pgTapAssertions: (tap.match(/^ok \d+ - /gm) || []).length === 54,
            pgTapNoFailures: !/^not ok /m.test(tap),
            concurrency:
              /one ok, one unavailable, one active hold, on-hand stock unchanged, PASS/.test(
                concurrency,
              ),
          };
          console.log(JSON.stringify(checks));
          if (Object.values(checks).some((value) => !value)) process.exit(1);
          NODE

      - name: Benchmark Storefront contract on staging and clean fixtures
        if: inputs.mode == 'apply' && inputs.run_performance_load
        env:
          STOREFRONT_LOAD_HOLD_SECONDS: ${{ inputs.load_hold_seconds }}
        run: |
          set -euo pipefail
          SOURCE_DB_URL="$(cat _storefront-migration/source-db-url)"
          docker run --rm --network host \
            -e STOREFRONT_DATABASE_URL="$SOURCE_DB_URL" \
            -e STAGING_SUPABASE_PROJECT_REF="$STAGING_SUPABASE_PROJECT_REF" \
            -e STOREFRONT_LOAD_ALLOW_REMOTE=APPLY_STOREFRONT_V1_STAGING_LOAD \
            -e STOREFRONT_LOAD_HOLD_SECONDS="$STOREFRONT_LOAD_HOLD_SECONDS" \
            -v "$PWD:/workspace:ro" \
            postgres:17 \
            bash /workspace/scripts/testing/storefront-v1-contract-load.sh \
            | tee _storefront-migration/evidence/contract-load.jsonl
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const records = readFileSync(
            "_storefront-migration/evidence/contract-load.jsonl",
            "utf8",
          ).trim().split("\n").map((line) => JSON.parse(line));
          const report = records[0];
          const cleanup = records.at(-1);
          const initialTargets = {
            catalogP95: report.metrics?.catalog_page?.p95Ms <= 500,
            searchP95: report.metrics?.search?.p95Ms <= 750,
            detailP95: report.metrics?.product_detail?.p95Ms <= 400,
          };
          // The staging project is the existing shared NANO runtime. Its
          // accepted release budget is recorded separately from the initial
          // target so a constrained-runner deviation is never reported as an
          // initial-target PASS.
          const releaseBudget = {
            profile: "staging-nano-20k-v1",
            catalogP95Ms: 800,
            searchP95Ms: 1200,
            detailP95Ms: 400,
          };
          const checks = {
            products: report.dataset?.products >= 20_000,
            publications: report.dataset?.publications >= 20_000,
            publishedMix: report.dataset?.publishedProducts === 20_000,
            draftMix: report.dataset?.draftProducts >= 1_000,
            pausedMix: report.dataset?.pausedProducts >= 1_000,
            categories: report.dataset?.categories === 100,
            equivalentRows: report.dataset?.equivalentRows >= 65_000,
            promotions: report.dataset?.promotionLinks >= 5_000,
            publicImages: report.dataset?.imagePublications >= 100 &&
              report.dataset?.imageBackedProjectionRows >= 100 &&
              report.dataset?.distinctImageUrls >= 1 &&
              report.dataset?.realImageTemplate === true,
            catalogInitialTarget: initialTargets.catalogP95,
            searchInitialTarget: initialTargets.searchP95,
            detailInitialTarget: initialTargets.detailP95,
            catalogReleaseBudget:
              report.metrics?.catalog_page?.p95Ms <= releaseBudget.catalogP95Ms,
            searchReleaseBudget:
              report.metrics?.search?.p95Ms <= releaseBudget.searchP95Ms,
            detailReleaseBudget:
              report.metrics?.product_detail?.p95Ms <= releaseBudget.detailP95Ms,
            catalogKeysetIndex: report.planSignals?.catalogKeysetIndexUsed === true,
            cleanup: cleanup?.cleanupVerified === true &&
              cleanup?.fixtureRowsAfterCleanup === 0,
          };
          const verdict = { initialTargets, releaseBudget, checks };
          require("node:fs").writeFileSync(
            "_storefront-migration/evidence/contract-load-verdict.json",
            `${JSON.stringify(verdict, null, 2)}\n`,
          );
          console.log(JSON.stringify(verdict));
          if (Object.values(checks).some((value) => !value)) process.exit(1);
          NODE

      - name: Remove protected connection material
        if: always()
        run: >-
          rm -f
          _storefront-migration/source-db-url
          _storefront-migration/post-verify.sql

      - name: Upload non-secret migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-v1-staging-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: _storefront-migration/evidence
          if-no-files-found: error
          retention-days: 14
